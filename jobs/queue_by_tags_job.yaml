apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: queue-by-tags-job
    environment: prod
    app.kubernetes.io/name: crossd
    app.kubernetes.io/instance: crossd-alpha
    app.kubernetes.io/version: "0.1"
    app.kubernetes.io/component: queue-by-tags-job
    app.kubernetes.io/part-of: crossd
  name: queue-by-tags-job
spec:
  template:
    spec:
      containers:
        - name: queue-by-tags-job
          # image: ghcr.io/fh-crossd/queue-by-tags:latest
          image: queue-by-tags:latest
          imagePullPolicy: Never
            #image: localhost:32000/queue-by-tags:latest
          command: ["sh", "-c"]
          args:
            - >
              python3 queue_by_tags.py --user $USER --password $PASSWORD manual manual2
          env:
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: arango-worker-pwd
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arango-worker-pwd
                  key: password
            - name: RAUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: RAUTH
          volumeMounts:
            - name: ca-certificates
              mountPath: /etc/ssl/certs/
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: ca-certificates
          configMap:
            name: cert-bundle
            defaultMode: 0644
            optional: false
            items:
              - key: ca-certificates.crt
                path: ca-certificates.crt
  backoffLimit: 4
